<a href="{{ href }}"
   class="group flex flex-col items-start gap-3.5 rounded-xl border border-line bg-white p-5 text-left no-underline transition-[border-color,box-shadow] duration-150 hover:border-brand-ring hover:no-underline hover:shadow-[0_6px_20px_rgba(13,26,34,0.06)]">
    <span class="icon-tile"><span class="icon text-[22px]" aria-hidden="true">{{ icon }}</span></span>
    <span class="flex flex-col gap-1">
        <span class="text-base font-bold text-ink">{{ title }}</span>
        <span class="text-[13.5px] leading-normal text-ink-muted">{{ desc }}</span>
    </span>
    <span class="flex items-center gap-1 text-[13px] font-bold text-brand">{{ cta }}<span class="icon text-[18px] transition-transform group-hover:translate-x-0.5" aria-hidden="true">arrow_forward</span></span>
</a>
