<!DOCTYPE html>
{% extends 'base.html' %}

{% load static %}



{%block body%}
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800">My Dashboard</h1>
        <nav class="flex mt-1 text-sm text-gray-500" aria-label="Breadcrumb">
          <ol class="flex items-center space-x-2">
            <li><a href="{%url 'home'%}" class="hover:text-blue-600">Home</a></li>
            <li><span class="mx-2 text-gray-400">/</span></li>
            <li class="font-medium text-gray-700">My Dashboard</li>
          </ol>
        </nav>
    </div>

    <!-- Main content -->
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
          <div class="flex items-center justify-between p-5 text-white rounded-lg bg-gradient-to-br from-blue-500 to-blue-600">
            <div>
              <h4 class="text-xl font-bold">Airspace Reservations</h4>
            </div>
            <a href="{% url 'reserve_main' %}" class="inline-block px-3 py-2 bg-white rounded bg-opacity-20">Go</a>
          </div>

          <div class="flex items-center justify-between p-5 text-white rounded-lg bg-gradient-to-br from-green-500 to-green-600">
            <div>
              <h4 class="text-xl font-bold">My Rpas</h4>
            </div>
            <a href="{% url 'rpas_list' %}" class="inline-block px-3 py-2 bg-white rounded bg-opacity-20">More</a>
          </div>

          <div class="flex items-center justify-between p-5 text-white rounded-lg bg-gradient-to-br from-yellow-400 to-yellow-500">
            <div>
              <h4 class="text-xl font-bold">Flight Logs</h4>
            </div>
            <a href="{% url 'logs_list' %}" class="inline-block px-3 py-2 bg-white rounded bg-opacity-20">More</a>
          </div>

          <div class="flex items-center justify-between p-5 text-white rounded-lg bg-gradient-to-br from-red-500 to-red-600">
            <div>
              <h4 class="text-xl font-bold">Geofences</h4>
            </div>
            <a href="{% url 'view_geofences' %}" class="inline-block px-3 py-2 bg-white rounded bg-opacity-20">More</a>
          </div>

          <div class="flex items-center justify-between p-5 text-white rounded-lg bg-gradient-to-br from-blue-400 to-blue-500">
            <div>
              <h4 class="text-xl font-bold">Weather</h4>
            </div>
            <a href="{% url 'weather' %}" class="inline-block px-3 py-2 bg-white rounded bg-opacity-20">More</a>
          </div>

          <div class="flex items-center justify-between p-5 bg-white border rounded-lg">
            <div>
              <h4 class="text-xl font-bold">Checklists</h4>
            </div>
            <a href="{% url 'checklist_list' %}" class="inline-block px-3 py-2 text-blue-600 rounded">More</a>
          </div>

    </div>

    {% endblock%}
