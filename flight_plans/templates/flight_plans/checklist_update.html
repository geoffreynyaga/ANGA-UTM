<!DOCTYPE html>
{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block head %}
    <title>Update Checklist</title>
{%endblock%}

{%block body%}
<section class="mx-auto max-w-2xl space-y-6">
  <div class="space-y-2">
    <a class="text-sm font-medium text-sky-700 hover:text-sky-800" href="{% url 'checklist_detail' pk=checklist.pk %}">Back to checklist</a>
    <h1 class="text-2xl font-semibold text-slate-900">Update Checklist Group</h1>
  </div>

  <form action="" method="POST" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="mt-6 flex justify-end">
      <button type="submit" class="inline-flex items-center rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-sky-700">Save</button>
    </div>
  </form>
</section>
{%endblock%}
