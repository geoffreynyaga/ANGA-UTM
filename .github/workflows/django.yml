name: Anga UTM CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: anga_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Renaming .env.sample to .env
        run: |
          cp .env.sample .env
      - name: Installing GeoDjango libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev libgeos-dev
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Check for missing migrations
        run: |
          python manage.py makemigrations --check --dry-run --settings=ANGA_UTM.settings.local_testing \
            organizations accounts maps rpas flight_plans applications weather \
            utm_messages notams notifications ui administration inventory maintenance
      - name: Run Tests
        run: |
          pytest --ds=ANGA_UTM.settings.local_testing --nomigrations
